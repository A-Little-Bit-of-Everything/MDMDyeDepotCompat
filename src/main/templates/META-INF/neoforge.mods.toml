modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://go.notaglitch.net"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

# ── Required dependencies ─────────────────────────────────────────────────────

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Music Disc Maker – the mod that owns the disc-dyeing table.
# We must load AFTER it so that DiscDye's static initialiser has already run.
[[dependencies."${mod_id}"]]
modId = "music_disc_maker"
type = "required"
versionRange = "[3.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Dye Depot – the mod whose dye items we are adding support for.
[[dependencies."${mod_id}"]]
modId = "dye_depot"
type = "required"
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"
